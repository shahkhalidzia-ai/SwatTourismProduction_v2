<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swat Tourism Platform â€” Executive System Showcase</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --pri: #0d9488;
      --tourist: #0d9488;
      --business: #2563eb;
      --community: #16a34a;
      --authority: #e11d48;
      --ink: #f8fafc;
      --mute: #94a3b8;
      --line: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #0f172a; border-bottom: 1px solid var(--line); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-badge { background: linear-gradient(135deg, #0d9488, #2563eb); padding: 6px 14px; border-radius: 8px; font-weight: 800; font-size: 14px; letter-spacing: 0.5px; }
    .logo-text h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .logo-text p { font-size: 12px; color: var(--mute); }
    
    .persona-tabs { display: flex; gap: 8px; }
    .tab-btn { background: #1e293b; color: var(--mute); border: 1px solid #334155; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .tab-btn:hover { color: #fff; border-color: #64748b; }
    .tab-btn.active-all { background: #334155; color: #fff; }
    .tab-btn.active-tourist { background: var(--tourist); color: #fff; border-color: var(--tourist); }
    .tab-btn.active-business { background: var(--business); color: #fff; border-color: var(--business); }
    .tab-btn.active-community { background: var(--community); color: #fff; border-color: var(--community); }
    .tab-btn.active-authority { background: var(--authority); color: #fff; border-color: var(--authority); }

    main { flex: 1; padding: 24px; display: flex; flex-direction: column; align-items: center; max-width: 1440px; margin: 0 auto; width: 100%; gap: 18px; }

    .player-container { width: 100%; background: #0b1120; border-radius: 14px; border: 1px solid #1e293b; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative; }
    .viewport { width: 100%; aspect-ratio: 16 / 10.5; max-height: 740px; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
    .viewport img { width: 100%; height: 100%; object-fit: contain; }

    .controls-bar { background: #0f172a; padding: 12px 24px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .playback-grp { display: flex; align-items: center; gap: 10px; }
    .btn-ctrl { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-ctrl:hover { background: #334155; }
    .btn-primary { background: #0d9488; border-color: #0d9488; }
    .btn-primary:hover { background: #0f766e; }

    .status-text { font-size: 14px; color: var(--mute); display: flex; align-items: center; gap: 8px; }
    .live-link-btn { background: #2563eb; color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .live-link-btn:hover { background: #1d4ed8; }

    .thumbnails-grid { width: 100%; display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 10px; }
    @media (max-width: 1100px) { .thumbnails-grid { grid-template-columns: repeat(4, 1fr); } }
    .thumb { background: #1e293b; border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; opacity: 0.6; transition: all 0.2s; position: relative; aspect-ratio: 16/10; }
    .thumb:hover { opacity: 0.9; }
    .thumb.active { border-color: #38bdf8; opacity: 1; transform: scale(1.03); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); font-size: 9px; padding: 2px 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .footer { text-align: center; padding: 20px; font-size: 12px; color: #64748b; border-top: 1px solid var(--line); }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-badge">EXECUTIVE DEMO</div>
      <div class="logo-text">
        <h1>Swat Tourism Platform â€” End-to-End Walkthrough</h1>
        <p>Interactive demonstration across Tourist, Business, Community, and Authority portals</p>
      </div>
    </div>
    <div class="persona-tabs">
      <button class="tab-btn active-all" onclick="filterPersona('ALL')">All (16 Steps)</button>
      <button class="tab-btn" onclick="filterPersona('TOURIST')">Tourist</button>
      <button class="tab-btn" onclick="filterPersona('BUSINESS')">Business</button>
      <button class="tab-btn" onclick="filterPersona('COMMUNITY')">Community</button>
      <button class="tab-btn" onclick="filterPersona('AUTHORITY')">Authority</button>
    </div>
  </header>

  <main>
    <div class="player-container">
      <div class="viewport">
        <img id="mainViewer" src="demo_frames/fresh_tagged_01_tourist_home.png" alt="Demo Screen">
      </div>
      <div class="controls-bar">
        <div class="playback-grp">
          <button class="btn-ctrl" onclick="prevStep()">â—€ Previous</button>
          <button class="btn-ctrl btn-primary" id="playPauseBtn" onclick="togglePlay()">â¸ Pause Walkthrough</button>
          <button class="btn-ctrl" onclick="nextStep()">Next â–¶</button>
          <select class="btn-ctrl" id="speedSelect" onchange="changeSpeed(this.value)">
            <option value="4000">Speed: Normal (4s)</option>
            <option value="2500" selected>Speed: Fast (2.5s)</option>
            <option value="6000">Speed: Slow (6s)</option>
          </select>
        </div>
        <div class="status-text">
          <span id="stepCounter" style="color: #fff; font-weight: 700;">Step 1 / 16</span>
          <span style="opacity: 0.5;">|</span>
          <a id="liveLink" class="live-link-btn" href="http://localhost:5180/?role=tourist&tab=home" target="_blank">ðŸš€ Open Live Screen</a>
        </div>
      </div>
    </div>

    <div class="thumbnails-grid" id="thumbGrid"></div>
  </main>

  <footer class="footer">
    Swat Tourism Platform â€¢ Ready for Executive Presentation â€¢ District Swat, Khyber Pakhtunkhwa
  </footer>

  <script>
    const FRAMES = [
      { id: "01_tourist_home", persona: "TOURIST", name: "Tourist: Home Feed", url: "http://localhost:5180/?role=tourist&tab=home", file: "demo_frames/fresh_tagged_01_tourist_home.png" },
      { id: "02_tourist_explore", persona: "TOURIST", name: "Tourist: Valley Explore", url: "http://localhost:5180/?role=tourist&tab=explore", file: "demo_frames/fresh_tagged_02_tourist_explore.png" },
      { id: "03_tourist_trips", persona: "TOURIST", name: "Tourist: Trip Planner", url: "http://localhost:5180/?role=tourist&tab=trips", file: "demo_frames/fresh_tagged_03_tourist_trips.png" },
      { id: "04_tourist_safety", persona: "TOURIST", name: "Tourist: SOS & Passes", url: "http://localhost:5180/?role=tourist&tab=safety", file: "demo_frames/fresh_tagged_04_tourist_safety.png" },
      { id: "05_business_today", persona: "BUSINESS", name: "Business: Operations KPI", url: "http://localhost:5180/?role=business&tab=today", file: "demo_frames/fresh_tagged_05_business_today.png" },
      { id: "06_business_listings", persona: "BUSINESS", name: "Business: Room Listings", url: "http://localhost:5180/?role=business&tab=listings", file: "demo_frames/fresh_tagged_06_business_listings.png" },
      { id: "07_business_availability", persona: "BUSINESS", name: "Business: 60-Day Cal", url: "http://localhost:5180/?role=business&tab=availability", file: "demo_frames/fresh_tagged_07_business_availability.png" },
      { id: "08_business_reviews", persona: "BUSINESS", name: "Business: Reviews", url: "http://localhost:5180/?role=business&tab=reviews", file: "demo_frames/fresh_tagged_08_business_reviews.png" },
      { id: "09_community_stories", persona: "COMMUNITY", name: "Community: Stories", url: "http://localhost:5180/?role=community&tab=stories", file: "demo_frames/fresh_tagged_09_community_stories.png" },
      { id: "10_community_crafts", persona: "COMMUNITY", name: "Community: Crafts WhatsApp", url: "http://localhost:5180/?role=community&tab=crafts", file: "demo_frames/fresh_tagged_10_community_crafts.png" },
      { id: "11_community_report", persona: "COMMUNITY", name: "Community: Incident Report", url: "http://localhost:5180/?role=community&tab=report", file: "demo_frames/fresh_tagged_11_community_report.png" },
      { id: "12_community_hosts", persona: "COMMUNITY", name: "Community: Homestay Hosts", url: "http://localhost:5180/?role=community&tab=hosts", file: "demo_frames/fresh_tagged_12_community_hosts.png" },
      { id: "13_authority_overview", persona: "AUTHORITY", name: "Authority: KPI Overview", url: "http://localhost:5180/?role=authority&tab=overview", file: "demo_frames/fresh_tagged_13_authority_overview.png" },
      { id: "14_authority_approvals", persona: "AUTHORITY", name: "Authority: Verifications", url: "http://localhost:5180/?role=authority&tab=approvals", file: "demo_frames/fresh_tagged_14_authority_approvals.png" },
      { id: "15_authority_advisories", persona: "AUTHORITY", name: "Authority: Advisories", url: "http://localhost:5180/?role=authority&tab=advisories", file: "demo_frames/fresh_tagged_15_authority_advisories.png" },
      { id: "16_authority_cases", persona: "AUTHORITY", name: "Authority: SOS Triage", url: "http://localhost:5180/?role=authority&tab=cases", file: "demo_frames/fresh_tagged_16_authority_cases.png" },
    ];

    let currentIndex = 0;
    let isPlaying = true;
    let playInterval = null;
    let speed = 2500;
    let currentFilter = 'ALL';

    function getFilteredFrames() {
      if (currentFilter === 'ALL') return FRAMES;
      return FRAMES.filter(f => f.persona === currentFilter);
    }

    function renderThumbnails() {
      const grid = document.getElementById('thumbGrid');
      grid.innerHTML = '';
      const list = getFilteredFrames();
      list.forEach((f, idx) => {
        const d = document.createElement('div');
        d.className = 'thumb ' + (idx === currentIndex ? 'active' : '');
        d.onclick = () => jumpTo(idx);
        d.innerHTML = `<img src="${f.file}" alt="${f.name}"><div class="thumb-label">${f.name}</div>`;
        grid.appendChild(d);
      });
    }

    function updateView() {
      const list = getFilteredFrames();
      if (!list[currentIndex]) currentIndex = 0;
      const f = list[currentIndex];

      document.getElementById('mainViewer').src = f.file;
      document.getElementById('stepCounter').textContent = `Step ${currentIndex + 1} / ${list.length} (${f.persona})`;
      document.getElementById('liveLink').href = f.url;

      const thumbs = document.querySelectorAll('.thumb');
      thumbs.forEach((t, i) => {
        t.className = 'thumb ' + (i === currentIndex ? 'active' : '');
      });
    }

    function nextStep() {
      const list = getFilteredFrames();
      currentIndex = (currentIndex + 1) % list.length;
      updateView();
    }

    function prevStep() {
      const list = getFilteredFrames();
      currentIndex = (currentIndex - 1 + list.length) % list.length;
      updateView();
    }

    function jumpTo(idx) {
      currentIndex = idx;
      updateView();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playPauseBtn');
      if (isPlaying) {
        btn.textContent = 'â¸ Pause Walkthrough';
        btn.className = 'btn-ctrl btn-primary';
        startAutoplay();
      } else {
        btn.textContent = 'â–¶ Play Walkthrough';
        btn.className = 'btn-ctrl';
        clearInterval(playInterval);
      }
    }

    function startAutoplay() {
      clearInterval(playInterval);
      playInterval = setInterval(() => {
        if (isPlaying) nextStep();
      }, speed);
    }

    function changeSpeed(val) {
      speed = parseInt(val);
      if (isPlaying) startAutoplay();
    }

    function filterPersona(p) {
      currentFilter = p;
      currentIndex = 0;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = 'tab-btn';
        if (b.textContent.toUpperCase().includes(p)) {
          b.className = 'tab-btn active-' + p.toLowerCase();
        }
      });
      renderThumbnails();
      updateView();
    }

    // Init
    renderThumbnails();
    updateView();
    startAutoplay();
  </script>
</body>
</html>
