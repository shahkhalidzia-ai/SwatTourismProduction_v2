<!DOCTYPE html>
<html lang="en" data-theme="lake">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme 1 Reference - Swat Lake (Existing Look)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Theme 1 - Swat Lake Tokens */
      --bg: #E8F1FA;
      --card: #FFFFFF;
      --ink: #12324A;
      --mute: #5E7A92;
      --pri: #2F7FC1;
      --soft: #D3E6F7;
      --acc: #F2A33A;
      --ok: #2E9D6B;
      --bad: #D6564A;
      --line: #D5E3F0;

      --font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius-card: 16px;
      --radius-button: 11px;
      --radius-tag: 9999px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1E2B;
        --card: #172C3D;
        --ink: #E6F1FA;
        --mute: #93AEC4;
        --pri: #2F7FC1;
        --soft: #1F3B52;
        --acc: #F2A33A;
        --ok: #2E9D6B;
        --bad: #D6564A;
        --line: #2A4659;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      padding: 20px 0;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--ink);
    }

    p.subtitle {
      font-size: 14px;
      color: var(--mute);
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      padding: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: var(--radius-button);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-pri { background: var(--pri); color: #FFFFFF; }
    .btn-acc { background: var(--acc); color: #12324A; }
    .btn-soft { background: var(--soft); color: var(--pri); }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: var(--radius-tag);
      font-size: 12px;
      font-weight: 600;
      background: var(--soft);
      color: var(--pri);
    }
    .tag-ok { background: #D5F0E3; color: var(--ok); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="tag">Theme 1: Swat Lake (Existing)</span>
      <h1 style="margin-top: 10px;">Swat Valley Tourism Portal</h1>
      <p class="subtitle">Plain clean header with no scenery or glass effects. Clean cards on lake-blue background.</p>
    </header>

    <div class="card">
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Standard Solid Card</h2>
      <p style="font-size: 14px; color: var(--mute); margin-bottom: 16px;">
        Cards have a 16px border-radius, 1px solid line border, and clean typography in Figtree.
      </p>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-pri">Primary Action</button>
        <button class="btn btn-acc">Call To Action</button>
        <button class="btn btn-soft">Secondary</button>
      </div>
    </div>
  </div>
</body>
</html>
